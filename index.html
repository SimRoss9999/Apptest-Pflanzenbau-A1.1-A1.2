<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="description" content="Prüfungstrainer Liebegg: Pflanzenbau A1.1 / A1.2, Tierhaltung B1.1 / B1.2 und Pflanzenbau A6.2">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Liebegg Trainer</title>
<style>
:root{
  --bg:#000;
  --panel:#080c08;
  --panel2:#0d130d;
  --line:#1c2a1c;
  --green:#00ff41;
  --green-dim:#00a82c;
  --green-glow:rgba(0,255,65,.18);
  --text:#f0f0f0;
  --muted:#8a968a;
  --wrong:#ff4d4d;
  --wrong-bg:rgba(255,77,77,.09);
  --right-bg:rgba(0,255,65,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.55;
  min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 96px}

/* --- Kopf --- */
header{padding:26px 0 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color:var(--green);
  font-size:21px;
  letter-spacing:.09em;
  font-weight:600;
  margin:0;
}
.brand .cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
.sub{color:var(--muted);font-size:13.5px;margin:5px 0 0}

h2{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color:var(--green);
  font-size:13px;
  letter-spacing:.1em;
  font-weight:600;
  margin:30px 0 12px;
}
h2:first-of-type{margin-top:0}

/* --- Kategorien --- */
.cat{
  display:flex;align-items:center;gap:13px;
  width:100%;text-align:left;
  background:var(--panel);
  border:1px solid var(--line);
  border-left:3px solid var(--line);
  border-radius:7px;
  color:var(--text);
  padding:14px 15px;
  margin-bottom:9px;
  font:inherit;
  cursor:pointer;
  transition:border-color .12s,background .12s;
}
.cat:hover,.cat:focus-visible{border-color:var(--green-dim);border-left-color:var(--green)}
.cat[aria-pressed="true"]{
  border-color:var(--green-dim);
  border-left-color:var(--green);
  background:var(--panel2);
  box-shadow:0 0 0 1px var(--green-glow)
}
.cat-body{flex:1;min-width:0}
.cat-name{font-weight:600;font-size:15px}
.cat-meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.cat-n{
  font-family:ui-monospace,Menlo,monospace;
  color:var(--green-dim);
  font-size:13px;
  flex-shrink:0;
}
.cat[aria-pressed="true"] .cat-n{color:var(--green)}

/* --- Anzahl-Chips --- */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{
  flex:1 1 auto;min-width:68px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:7px;
  color:var(--text);
  font:inherit;font-size:15px;font-weight:600;
  padding:13px 10px;
  cursor:pointer;
  transition:border-color .12s,color .12s,background .12s;
}
.chip:hover,.chip:focus-visible{border-color:var(--green-dim)}
.chip[aria-pressed="true"]{
  border-color:var(--green);
  background:var(--panel2);
  color:var(--green);
  box-shadow:0 0 0 1px var(--green-glow)
}
.chip:disabled{opacity:.3;cursor:not-allowed}

/* --- Buttons --- */
.btn{
  display:block;width:100%;
  background:var(--green);
  color:#000;
  border:none;border-radius:7px;
  font:inherit;font-size:16px;font-weight:700;
  letter-spacing:.02em;
  padding:16px;
  cursor:pointer;
  transition:opacity .12s;
}
.btn:hover,.btn:focus-visible{opacity:.86}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn-ghost{
  background:transparent;
  color:var(--text);
  border:1px solid var(--line);
}
.btn-ghost:hover,.btn-ghost:focus-visible{border-color:var(--green-dim);opacity:1}
.btn+.btn{margin-top:10px}

.sticky{
  position:fixed;left:0;right:0;bottom:0;
  background:linear-gradient(to top,#000 62%,transparent);
  padding:20px 16px calc(16px + env(safe-area-inset-bottom));
}
.sticky-inner{max-width:640px;margin:0 auto}

/* --- Quiz --- */
.qbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.qcount{font-family:ui-monospace,Menlo,monospace;color:var(--green);font-size:13px;letter-spacing:.05em}
.qcat{color:var(--muted);font-size:12.5px;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:26px}
.bar>i{display:block;height:100%;background:var(--green);transition:width .25s ease}

.qtext{font-size:18.5px;line-height:1.45;font-weight:600;margin:0 0 22px}

.opt{
  display:flex;gap:12px;align-items:flex-start;
  width:100%;text-align:left;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:7px;
  color:var(--text);
  padding:14px 15px;
  margin-bottom:10px;
  font:inherit;font-size:15.5px;line-height:1.45;
  cursor:pointer;
  transition:border-color .12s,background .12s;
}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--green-dim)}
.opt:disabled{cursor:default}
.opt .key{
  font-family:ui-monospace,Menlo,monospace;
  color:var(--green-dim);
  font-size:14px;
  flex-shrink:0;
  padding-top:1px;
}
.opt.correct{border-color:var(--green);background:var(--right-bg)}
.opt.correct .key{color:var(--green)}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.opt.wrong .key{color:var(--wrong)}
.opt.dim{opacity:.45}

.fb{
  border-left:3px solid var(--green);
  background:var(--panel2);
  border-radius:0 7px 7px 0;
  padding:15px 16px;
  margin-top:18px;
}
.fb.bad{border-left-color:var(--wrong)}
.fb b{display:block;color:var(--green);font-size:14.5px;margin-bottom:6px}
.fb.bad b{color:var(--wrong)}
.fb p{margin:0;font-size:15px;line-height:1.55}
.fb .src{color:var(--muted);font-size:12.5px;margin-top:9px;font-family:ui-monospace,Menlo,monospace}

/* --- Resultat --- */
.score{
  text-align:center;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--panel);
  padding:28px 20px;
  margin-bottom:24px;
}
.score .big{
  font-family:ui-monospace,Menlo,monospace;
  font-size:46px;font-weight:700;color:var(--green);
  line-height:1;letter-spacing:-.02em;
}
.score .pct{color:var(--muted);font-size:14px;margin-top:9px}
.score .verdict{font-size:15.5px;margin-top:14px;color:var(--text)}

.rev{border:1px solid var(--line);border-radius:7px;background:var(--panel);margin-bottom:9px;overflow:hidden}
.rev summary{
  list-style:none;cursor:pointer;
  padding:13px 15px;
  display:flex;gap:11px;align-items:flex-start;
  font-size:14.5px;line-height:1.45;
}
.rev summary::-webkit-details-marker{display:none}
.rev .mark{font-family:ui-monospace,Menlo,monospace;font-weight:700;flex-shrink:0}
.rev.ok .mark{color:var(--green)}
.rev.no .mark{color:var(--wrong)}
.rev .inner{padding:0 15px 15px;border-top:1px solid var(--line);margin-top:2px;padding-top:13px}
.rev .line{font-size:14.5px;margin:0 0 8px}
.rev .line span{color:var(--muted)}
.rev .ans-ok{color:var(--green)}
.rev .ans-no{color:var(--wrong)}
.rev .exp{font-size:14.5px;color:var(--text);margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line)}

/* --- History --- */
.hist{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  border:1px solid var(--line);border-left:3px solid var(--green-dim);
  border-radius:0 7px 7px 0;
  background:var(--panel);
  padding:13px 15px;margin-bottom:9px;
  width:100%;text-align:left;font:inherit;color:var(--text);cursor:pointer;
}
.hist:hover,.hist:focus-visible{border-color:var(--green-dim);border-left-color:var(--green)}
.hist .h-cat{font-size:14.5px;font-weight:600}
.hist .h-date{color:var(--muted);font-size:12.5px;margin-top:2px}
.hist .h-score{font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:700;flex-shrink:0}
.empty{color:var(--muted);font-size:14.5px;border:1px dashed var(--line);border-radius:7px;padding:22px 16px;text-align:center}

.hint{color:var(--muted);font-size:13px;margin:12px 0 0}
.switch{
  background:none;border:none;padding:0;margin:12px 0 0;
  font:inherit;font-size:13px;color:var(--green-dim);cursor:pointer;
  font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em;
}
.switch:hover,.switch:focus-visible{color:var(--green)}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">

<!-- ========== PRÜFUNGSWAHL ========== -->
<section id="view-exam">
  <header>
    <h1 class="brand">LIEBEGG_TRAINER<span class="cursor">_</span></h1>
    <p class="sub">Welche Prüfung möchtest du üben?</p>
  </header>
  <h2>PRÜFUNG</h2>
  <div id="exams"></div>
</section>

<!-- ========== START ========== -->
<section id="view-start" class="hide">
  <header>
    <h1 class="brand">LIEBEGG_TRAINER<span class="cursor">_</span></h1>
    <p class="sub" id="examSub"></p>
    <button class="switch" id="switchBtn" type="button">&lt; Prüfung wechseln</button>
  </header>

  <h2>BEREICH</h2>
  <div id="cats"></div>

  <h2>ANZAHL FRAGEN</h2>
  <div class="chips" id="counts"></div>
  <p class="hint" id="poolInfo"></p>

  <h2>VERLAUF</h2>
  <div id="histList"></div>
  <button class="btn btn-ghost hide" id="clearHist" style="margin-top:10px">Verlauf löschen</button>
</section>

<div class="sticky hide" id="startBar">
  <div class="sticky-inner">
    <button class="btn" id="startBtn">Test starten</button>
  </div>
</div>

<!-- ========== QUIZ ========== -->
<section id="view-quiz" class="hide">
  <div class="qbar">
    <span class="qcount" id="qCount"></span>
    <span class="qcat" id="qCat"></span>
  </div>
  <div class="bar"><i id="qBar" style="width:0%"></i></div>
  <p class="qtext" id="qText"></p>
  <div id="qOpts"></div>
  <div id="qFb"></div>
</section>

<div class="sticky hide" id="quizBar">
  <div class="sticky-inner">
    <button class="btn" id="nextBtn" disabled>Antwort wählen</button>
    <button class="btn btn-ghost" id="abortBtn">Test abbrechen</button>
  </div>
</div>

<!-- ========== RESULTAT ========== -->
<section id="view-result" class="hide">
  <header>
    <h1 class="brand" id="resTitle">RESULTAT<span class="cursor">_</span></h1>
    <p class="sub" id="resSub"></p>
  </header>
  <div class="score">
    <div class="big" id="resBig"></div>
    <div class="pct" id="resPct"></div>
    <div class="verdict" id="resVerdict"></div>
  </div>
  <h2>ALLE FRAGEN</h2>
  <div id="resList"></div>
</section>

<div class="sticky hide" id="resultBar">
  <div class="sticky-inner">
    <button class="btn" id="againBtn">Gleicher Bereich nochmals</button>
    <button class="btn btn-ghost" id="homeBtn">Zurück zum Start</button>
  </div>
</div>

</div>

<script src="questions.js"></script>
<script src="questions-tierhaltung.js"></script>
<script src="questions-kunstwiesen.js"></script>
<script>
(function(){
"use strict";

const LETTERS = ['A','B','C','D','E'];

/* Prüfungen. Der Verlaufsschlüssel von Pflanzenbau bleibt unverändert,
   damit bestehende Durchläufe erhalten bleiben. */
const EXAMS = {
  pflanzenbau: {
    id: 'pflanzenbau',
    title: 'Pflanzenbau A1.1 & A1.2',
    sub: 'Boden befahren und bearbeiten',
    allLabel: 'Alles (A1.1 + A1.2)',
    cats: CATEGORIES,
    qs: QUESTIONS,
    key: 'liebegg_history_v1'
  },
  tierhaltung: {
    id: 'tierhaltung',
    title: 'Tierhaltung B1.1 & B1.2',
    sub: 'Mit Rindern umgehen und für das Wohlbefinden sorgen',
    allLabel: 'Alles (B1.1 + B1.2)',
    cats: CATEGORIES_TIER,
    qs: QUESTIONS_TIER,
    key: 'liebegg_history_tier_v1'
  },
  kunstwiesen: {
    id: 'kunstwiesen',
    title: 'Pflanzenbau A6.2',
    sub: 'Mischungen für Kunstwiesen wählen und bewirtschaften',
    allLabel: 'Alles (A6.2)',
    cats: CATEGORIES_KW,
    qs: QUESTIONS_KW,
    key: 'liebegg_history_kw_v1'
  }
};

const state = {
  exam: null,
  cat: 'all',
  count: 20,
  queue: [],
  idx: 0,
  answers: [],
  answered: false
};

const $ = id => document.getElementById(id);

/* ---------- Hilfsfunktionen ---------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function poolFor(cat){
  const qs = state.exam.qs;
  return cat === 'all' ? qs : qs.filter(q => q.c === cat);
}
function catName(id){
  if(id === 'all') return state.exam.allLabel;
  const c = state.exam.cats.find(c => c.id === id);
  return c ? c.name : id;
}
function loadHistFor(exam){
  try { return JSON.parse(localStorage.getItem(exam.key)) || []; }
  catch(e){ return []; }
}
function loadHist(){ return loadHistFor(state.exam); }
function saveHist(list){
  try { localStorage.setItem(state.exam.key, JSON.stringify(list.slice(0,40))); }
  catch(e){ /* Speicher voll oder gesperrt - Verlauf geht verloren, Test läuft weiter */ }
}
function fmtDate(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2,'0');
  return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' &middot; '+p(d.getHours())+':'+p(d.getMinutes());
}
function show(view){
  ['exam','start','quiz','result'].forEach(v=>{
    $('view-'+v).classList.toggle('hide', v !== view);
  });
  $('startBar').classList.toggle('hide', view !== 'start');
  $('quizBar').classList.toggle('hide', view !== 'quiz');
  $('resultBar').classList.toggle('hide', view !== 'result');
  window.scrollTo(0,0);
}

/* ---------- Prüfungswahl ---------- */
function renderExams(){
  const box = $('exams');
  box.innerHTML = '';
  Object.keys(EXAMS).forEach(id=>{
    const ex = EXAMS[id];
    const runs = loadHistFor(ex).length;
    const b = document.createElement('button');
    b.className = 'cat';
    b.type = 'button';
    b.innerHTML =
      '<div class="cat-body"><div class="cat-name"></div><div class="cat-meta"></div></div>' +
      '<span class="cat-n"></span>';
    b.querySelector('.cat-name').textContent = ex.title;
    b.querySelector('.cat-meta').textContent = ex.sub + ' · ' + (runs ? runs + (runs === 1 ? ' Durchlauf' : ' Durchläufe') : 'noch kein Durchlauf');
    b.querySelector('.cat-n').textContent = ex.qs.length;
    b.addEventListener('click', ()=> selectExam(id));
    box.appendChild(b);
  });
}

function selectExam(id){
  state.exam = EXAMS[id];
  state.cat = 'all';
  state.count = 20;
  $('examSub').textContent = state.exam.title + ' · ' + state.exam.sub;
  renderCats(); renderCounts(); renderHist();
  show('start');
}

/* ---------- Startbildschirm ---------- */
function renderCats(){
  const box = $('cats');
  box.innerHTML = '';
  const all = [{id:'all', name:'Alles', lz:'Gesamter Prüfungsstoff'}].concat(state.exam.cats);
  all.forEach(c=>{
    const n = poolFor(c.id).length;
    const b = document.createElement('button');
    b.className = 'cat';
    b.type = 'button';
    b.setAttribute('aria-pressed', state.cat === c.id ? 'true' : 'false');
    b.innerHTML =
      '<div class="cat-body"><div class="cat-name"></div><div class="cat-meta"></div></div>' +
      '<span class="cat-n">'+n+'</span>';
    b.querySelector('.cat-name').textContent = c.name;
    b.querySelector('.cat-meta').textContent = c.lz;
    b.addEventListener('click', ()=>{
      state.cat = c.id;
      renderCats();
      renderCounts();
    });
    box.appendChild(b);
  });
}

function renderCounts(){
  const pool = poolFor(state.cat).length;
  const opts = [10, 20, 30, 50, pool];
  const seen = new Set();
  const box = $('counts');
  box.innerHTML = '';

  opts.forEach(n=>{
    if(n > pool || seen.has(n)) return;
    seen.add(n);
    const isAll = (n === pool);
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.textContent = isAll ? 'Alle ('+n+')' : n;
    b.setAttribute('aria-pressed', state.count === n ? 'true' : 'false');
    b.addEventListener('click', ()=>{ state.count = n; renderCounts(); });
    box.appendChild(b);
  });

  // Falls die gewählte Anzahl im neuen Bereich nicht existiert: nächstkleinere nehmen
  if(!seen.has(state.count)){
    state.count = Math.max.apply(null, Array.from(seen).filter(n => n <= pool));
    renderCounts();
    return;
  }
  $('poolInfo').textContent = catName(state.cat)+' – '+pool+' Fragen im Pool, zufällig gemischt.';
}

function renderHist(){
  const list = loadHist();
  const box = $('histList');
  box.innerHTML = '';
  $('clearHist').classList.toggle('hide', list.length === 0);

  if(!list.length){
    box.innerHTML = '<div class="empty">Noch keine Durchläufe. Der erste Test landet hier.</div>';
    return;
  }
  list.forEach((h, i)=>{
    const pct = Math.round(h.right / h.total * 100);
    const b = document.createElement('button');
    b.className = 'hist';
    b.type = 'button';
    b.innerHTML =
      '<span><span class="h-cat"></span><span class="h-date"></span></span>' +
      '<span class="h-score">'+h.right+'/'+h.total+'</span>';
    b.querySelector('.h-cat').textContent = h.catName;
    b.querySelector('.h-date').innerHTML = fmtDate(h.ts);
    b.querySelector('.h-cat').style.display = 'block';
    b.querySelector('.h-date').style.display = 'block';
    b.querySelector('.h-score').style.color = pct >= 80 ? 'var(--green)' : (pct >= 60 ? 'var(--text)' : 'var(--wrong)');
    b.addEventListener('click', ()=> openHist(i));
    box.appendChild(b);
  });
}

function openHist(i){
  const h = loadHist()[i];
  if(!h) return;
  state.answers = h.answers;
  state.cat = h.cat;
  showResult(h.catName, h.ts, false);
}

/* ---------- Quiz ---------- */
function start(){
  const pool = poolFor(state.cat);
  state.queue = shuffle(pool).slice(0, Math.min(state.count, pool.length));
  state.idx = 0;
  state.answers = [];
  show('quiz');
  renderQ();
}

function renderQ(){
  const q = state.queue[state.idx];
  state.answered = false;

  $('qCount').textContent = 'FRAGE '+(state.idx+1)+' / '+state.queue.length;
  $('qCat').textContent = catName(q.c);
  $('qBar').style.width = (state.idx / state.queue.length * 100)+'%';
  $('qText').textContent = q.q;
  $('qFb').innerHTML = '';

  // Optionen mischen, richtige Antwort mitführen
  const order = shuffle(q.o.map((t,i)=>({t, i})));
  const box = $('qOpts');
  box.innerHTML = '';

  order.forEach((o, pos)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.type = 'button';
    b.innerHTML = '<span class="key">'+LETTERS[pos]+'</span><span class="txt"></span>';
    b.querySelector('.txt').textContent = o.t;
    b.addEventListener('click', ()=> answer(o.i, box, order));
    box.appendChild(b);
  });

  const nb = $('nextBtn');
  nb.disabled = true;
  nb.textContent = 'Antwort wählen';
  window.scrollTo(0,0);
}

function answer(chosen, box, order){
  if(state.answered) return;
  state.answered = true;

  const q = state.queue[state.idx];
  const ok = chosen === q.a;
  state.answers.push({ q: q.q, opts: q.o, correct: q.a, chosen: chosen, exp: q.e, src: q.s || '', cat: q.c, ok: ok });

  Array.from(box.children).forEach((b, pos)=>{
    b.disabled = true;
    const origIdx = order[pos].i;
    if(origIdx === q.a) b.classList.add('correct');
    else if(origIdx === chosen) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const fb = document.createElement('div');
  fb.className = 'fb' + (ok ? '' : ' bad');
  fb.innerHTML = '<b></b><p></p>' + (q.s ? '<div class="src"></div>' : '');
  fb.querySelector('b').textContent = ok ? 'Richtig.' : 'Nicht ganz.';
  fb.querySelector('p').textContent = q.e;
  if(q.s) fb.querySelector('.src').textContent = 'Quelle: ' + q.s;
  $('qFb').appendChild(fb);

  const nb = $('nextBtn');
  nb.disabled = false;
  nb.textContent = (state.idx + 1 < state.queue.length) ? 'Nächste Frage' : 'Test auswerten';
  nb.focus({preventScroll:true});
}

function next(){
  if(!state.answered) return;
  state.idx++;
  if(state.idx < state.queue.length){
    renderQ();
  } else {
    finish();
  }
}

function finish(){
  const right = state.answers.filter(a => a.ok).length;
  const ts = Date.now();
  const name = catName(state.cat);

  const list = loadHist();
  list.unshift({ ts: ts, cat: state.cat, catName: name, right: right, total: state.answers.length, answers: state.answers });
  saveHist(list);

  showResult(name, ts, true);
}

/* ---------- Resultat ---------- */
function showResult(name, ts, fresh){
  const right = state.answers.filter(a => a.ok).length;
  const total = state.answers.length;
  const pct = total ? Math.round(right / total * 100) : 0;

  $('resTitle').innerHTML = (fresh ? 'RESULTAT' : 'VERLAUF') + '<span class="cursor">_</span>';
  $('resSub').innerHTML = name + ' &middot; ' + fmtDate(ts);
  $('resBig').textContent = right + '/' + total;
  $('resPct').textContent = pct + '% richtig';
  $('resBig').style.color = pct >= 80 ? 'var(--green)' : (pct >= 60 ? 'var(--text)' : 'var(--wrong)');

  let v;
  if(pct === 100)      v = 'Alles richtig. Dieser Bereich sitzt.';
  else if(pct >= 80)   v = 'Solide. Schau dir die Fehler unten kurz an.';
  else if(pct >= 60)   v = 'Grundlage steht, aber es fehlen noch Details.';
  else                 v = 'Hier lohnt sich eine Runde im Lerndossier, bevor du weitertestest.';
  $('resVerdict').textContent = v;

  const box = $('resList');
  box.innerHTML = '';
  state.answers.forEach((a, i)=>{
    const d = document.createElement('details');
    d.className = 'rev ' + (a.ok ? 'ok' : 'no');

    const s = document.createElement('summary');
    s.innerHTML = '<span class="mark">' + (a.ok ? '+' : '×') + '</span><span class="s-txt"></span>';
    s.querySelector('.s-txt').textContent = (i+1) + '. ' + a.q;
    d.appendChild(s);

    const inner = document.createElement('div');
    inner.className = 'inner';

    if(!a.ok){
      const p1 = document.createElement('p');
      p1.className = 'line';
      p1.innerHTML = '<span>Deine Antwort:</span> <span class="ans-no"></span>';
      p1.querySelector('.ans-no').textContent = a.opts[a.chosen];
      inner.appendChild(p1);
    }
    const p2 = document.createElement('p');
    p2.className = 'line';
    p2.innerHTML = '<span>Richtig:</span> <span class="ans-ok"></span>';
    p2.querySelector('.ans-ok').textContent = a.opts[a.correct];
    inner.appendChild(p2);

    const p3 = document.createElement('p');
    p3.className = 'exp';
    p3.textContent = a.exp + (a.src ? '  (' + a.src + ')' : '');
    inner.appendChild(p3);

    d.appendChild(inner);
    if(!a.ok) d.open = true;
    box.appendChild(d);
  });

  show('result');
}

/* ---------- Verdrahtung ---------- */
$('startBtn').addEventListener('click', start);
$('switchBtn').addEventListener('click', ()=>{ renderExams(); show('exam'); });
$('nextBtn').addEventListener('click', next);
$('againBtn').addEventListener('click', start);
$('homeBtn').addEventListener('click', ()=>{ renderHist(); renderCats(); renderCounts(); show('start'); });
$('abortBtn').addEventListener('click', ()=>{
  if(confirm('Test abbrechen? Der Durchlauf wird nicht gespeichert.')){
    renderHist(); show('start');
  }
});
$('clearHist').addEventListener('click', ()=>{
  if(confirm('Gesamten Verlauf löschen?')){
    try { localStorage.removeItem(state.exam.key); } catch(e){}
    renderHist();
  }
});

// Tastatur: A-E zum Antworten, Enter für weiter (praktisch am Desktop)
document.addEventListener('keydown', e=>{
  if($('view-quiz').classList.contains('hide')) return;
  if(e.key === 'Enter' && state.answered){ next(); return; }
  const i = LETTERS.indexOf(e.key.toUpperCase());
  if(i > -1 && !state.answered){
    const b = $('qOpts').children[i];
    if(b) b.click();
  }
});

renderExams();
show('exam');
})();
</script>
</body>
</html>
